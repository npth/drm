        $ref: './crm/client.yaml#/components/requestBodies/TypeInsertRequest'
      responses:
        200:
          $ref: './crm/client.yaml#/components/responses/TypeResponse'
        500:
          $ref: './common/components.yaml#/components/responses/ErrorResponse'
  /clients/types/update:

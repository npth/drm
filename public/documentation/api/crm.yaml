      tags:
        - client
      summary: "Типы клиентов"
      responses:
        200:
          $ref: './crm/client.yaml#/components/responses/TypesResponse'
        500:
          $ref: './common/components.yaml#/components/responses/ErrorResponse'
  /clients/types/insert:
    post:
      tags:
        - client
      summary: "Добавление нового типа клиента"

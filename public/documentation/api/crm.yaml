openapi: 3.1.0
info:
  title: "СРМ (Клиенты и счета)"
  description: "<a href=\"/documentation/index.html?entry=/api/index.yaml\">Главная</a>"
  version: 1.0.0
servers:
  - url: '/api/crm'
security:
  - bearerAuth: []
tags:
  - name: client
    description: "Клиенты"
  - name: balance
    description: "Баланс"
  - name: contract-items
    description: "Справочники счетов"
  - name: tariff
    description: "Тарифы"
  - name: contract
    description: "Счета"
components:
  securitySchemes:

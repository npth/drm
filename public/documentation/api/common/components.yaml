openapi: 3.0.1
info:
  title: Title
  description: Title
  version: 1.0.0
components:
  schemas:
    CreatedAt:
      type: string
      format: 'datetimez'
      description: "Дата создания"
      example: '2026-04-01T17:16:02.000000Z'
    UpdatedAt:
      type: string
      format: 'datetimez'
      description: "Дата изменения"
      example: '2026-04-01T18:26:05.000000Z'
    DeletedAt:
      type: string
      format: 'datetimez'
      description: "Дата удаления"
      example: '2026-04-01T18:26:05.000000Z'
  responses:
    ErrorResponse:
      description: "Сообщение об ошибке"
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: "Код статуса"
                example: 500
              message:
                type: string
                description: "Сообщение об ошибке, допустимое для вывода пользователю"
                example: "Текст ошибки"
              trace_id:
                type: string
                description: "Идентификатор лога для разработчика"
                example: "err_69fb51d38dec65"



        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        name:
          $ref: "#/components/schemas/DistrictDiscountName"
        codes:
          $ref: "#/components/schemas/PromoCodes"
        client_emails:
          $ref: "#/components/schemas/ClientEmails"
        started_at:
          $ref: "#/components/schemas/StartedAt"
        finished_at:
          $ref: "#/components/schemas/FinishedAt"
        usage_limit:
          $ref: "#/components/schemas/UsageLimit"
        first_limit:
          $ref: "#/components/schemas/FirstLimit"
        discount_type:
          $ref: "#/components/schemas/DiscountType"
        discount_value:
          $ref: "#/components/schemas/DiscountValue"
        note:
          $ref: "#/components/schemas/PromoCodeNote"

    PromoCodeInsert:
      type: object
      description: "Добавление промокода"
      properties:
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        name:
          $ref: "#/components/schemas/DistrictDiscountName"
        codes:
          $ref: "#/components/schemas/PromoCodes"
        client_emails:
          $ref: "#/components/schemas/ClientEmails"
        started_at:
          $ref: "#/components/schemas/StartedAt"
        finished_at:
          $ref: "#/components/schemas/FinishedAt"
        usage_limit:
          $ref: "#/components/schemas/UsageLimit"
        first_limit:
          $ref: "#/components/schemas/FirstLimit"
        discount_type:
          $ref: "#/components/schemas/DiscountType"
        discount_value:
          $ref: "#/components/schemas/DiscountValue"
        note:
          $ref: "#/components/schemas/PromoCodeNote"
      required:
        - macroregion_id
        - name
        - codes
        - discount_type
        - discount_value

    PromoCodeUpdate:
      type: object
      description: "Обновление промокода"
      properties:
        id:
          $ref: "#/components/schemas/DiscountId"
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        name:
          $ref: "#/components/schemas/DistrictDiscountName"
        codes:
          $ref: "#/components/schemas/PromoCodes"
        client_emails:
          $ref: "#/components/schemas/ClientEmails"
        started_at:
          $ref: "#/components/schemas/StartedAt"
        finished_at:
          $ref: "#/components/schemas/FinishedAt"
        usage_limit:
          $ref: "#/components/schemas/UsageLimit"
        first_limit:
          $ref: "#/components/schemas/FirstLimit"
        discount_type:
          $ref: "#/components/schemas/DiscountType"
        discount_value:
          $ref: "#/components/schemas/DiscountValue"
        note:

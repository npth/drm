    Exchange:
      type: object
      description: "Тариф на обмен"
      properties:
        id:
          $ref: "#/components/schemas/ExchangeId"
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        name:
          $ref: "#/components/schemas/ExchangeName"
        note:
          $ref: "#/components/schemas/ExchangeNote"
        confirmed_insert_price:
          $ref: "#/components/schemas/ConfirmedInsertPrice"
        confirmed_update_price:
          $ref: "#/components/schemas/ConfirmedUpdatePrice"
        confirmed_delete_price:
          $ref: "#/components/schemas/ConfirmedDeletePrice"
        confirmed_initial_price:
          $ref: "#/components/schemas/ConfirmedInitialPrice"
        edited_insert_price:
          $ref: "#/components/schemas/EditedInsertPrice"
        edited_update_price:
          $ref: "#/components/schemas/EditedUpdatePrice"
        edited_delete_price:
          $ref: "#/components/schemas/EditedDeletePrice"
        edited_initial_price:
          $ref: "#/components/schemas/EditedInitialPrice"
        loaded_insert_price:
          $ref: "#/components/schemas/LoadedInsertPrice"
        loaded_update_price:
          $ref: "#/components/schemas/LoadedUpdatePrice"
        loaded_delete_price:
          $ref: "#/components/schemas/LoadedDeletePrice"
        loaded_initial_price:
          $ref: "#/components/schemas/LoadedInitialPrice"
        initial_count:
          $ref: "#/components/schemas/InitialCount"

    ExchangeInsert:
      type: object
      description: "Добавление тарифа на обмен"
      properties:
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        name:
          $ref: "#/components/schemas/ExchangeName"
        note:
          $ref: "#/components/schemas/ExchangeNote"
        confirmed_insert_price:
          $ref: "#/components/schemas/ConfirmedInsertPrice"
        confirmed_update_price:
          $ref: "#/components/schemas/ConfirmedUpdatePrice"
        confirmed_delete_price:
          $ref: "#/components/schemas/ConfirmedDeletePrice"
        confirmed_initial_price:
          $ref: "#/components/schemas/ConfirmedInitialPrice"
        edited_insert_price:
          $ref: "#/components/schemas/EditedInsertPrice"
        edited_update_price:
          $ref: "#/components/schemas/EditedUpdatePrice"
        edited_delete_price:
          $ref: "#/components/schemas/EditedDeletePrice"
        edited_initial_price:
          $ref: "#/components/schemas/EditedInitialPrice"
        loaded_insert_price:
          $ref: "#/components/schemas/LoadedInsertPrice"
        loaded_update_price:
          $ref: "#/components/schemas/LoadedUpdatePrice"
        loaded_delete_price:
          $ref: "#/components/schemas/LoadedDeletePrice"
        loaded_initial_price:
          $ref: "#/components/schemas/LoadedInitialPrice"
        initial_count:
          $ref: "#/components/schemas/InitialCount"
      required:
        - macroregion_id
        - name
        - confirmed_insert_price
        - confirmed_update_price
        - confirmed_delete_price
        - confirmed_initial_price
        - edited_insert_price
        - edited_update_price
        - edited_delete_price
        - edited_initial_price
        - loaded_insert_price
        - loaded_update_price
        - loaded_delete_price
        - loaded_initial_price
        - initial_count

    ExchangeUpdate:
      type: object
      description: "Обновление тарифа на обмен"
      properties:
        id:
          $ref: "#/components/schemas/ExchangeId"
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        name:
          $ref: "#/components/schemas/ExchangeName"
        note:
          $ref: "#/components/schemas/ExchangeNote"
        confirmed_insert_price:
          $ref: "#/components/schemas/ConfirmedInsertPrice"
        confirmed_update_price:
          $ref: "#/components/schemas/ConfirmedUpdatePrice"
        confirmed_delete_price:
          $ref: "#/components/schemas/ConfirmedDeletePrice"
        confirmed_initial_price:
          $ref: "#/components/schemas/ConfirmedInitialPrice"
        edited_insert_price:
          $ref: "#/components/schemas/EditedInsertPrice"
        edited_update_price:
          $ref: "#/components/schemas/EditedUpdatePrice"
        edited_delete_price:
          $ref: "#/components/schemas/EditedDeletePrice"
        edited_initial_price:
          $ref: "#/components/schemas/EditedInitialPrice"
        loaded_insert_price:
          $ref: "#/components/schemas/LoadedInsertPrice"
        loaded_update_price:
          $ref: "#/components/schemas/LoadedUpdatePrice"
        loaded_delete_price:
          $ref: "#/components/schemas/LoadedDeletePrice"
        loaded_initial_price:
          $ref: "#/components/schemas/LoadedInitialPrice"
        initial_count:
          $ref: "#/components/schemas/InitialCount"
      required:
        - id
        - macroregion_id
        - name
        - confirmed_insert_price
        - confirmed_update_price
        - confirmed_delete_price
        - confirmed_initial_price
        - edited_insert_price
        - edited_update_price
        - edited_delete_price
        - edited_initial_price
        - loaded_insert_price
        - loaded_update_price
        - loaded_delete_price
        - loaded_initial_price
        - initial_count


    ExchangeDelete:
      type: object
      description: "Удаление тарифа"
      properties:
        id:
          $ref: "#/components/schemas/DiscountId"
      required:
        - id

  requestBodies:

    GroupInsertRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupInsert'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/GroupInsert'
    GroupUpdateRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupUpdate'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/GroupUpdate'
    GroupDeleteRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupDelete'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/GroupDelete'


    TariffInsertRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TariffInsert'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TariffInsert'
    TariffUpdateRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TariffUpdate'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TariffUpdate'
    TariffDeleteRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TariffDelete'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/TariffDelete'

    DiscountInsertRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscountInsert'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/DiscountInsert'
    DiscountUpdateRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscountUpdate'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/DiscountUpdate'
    DiscountDeleteRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DiscountDelete'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/DiscountDelete'

    DistrictDiscountInsertRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DistrictDiscountInsert'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/DistrictDiscountInsert'
    DistrictDiscountUpdateRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DistrictDiscountUpdate'
        application/x-www-form-urlencoded:

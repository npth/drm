        description:
          $ref: "#/components/schemas/DistrictDiscountDescription"
        district_ids:
          $ref: "./contract.yaml#/components/schemas/DistrictIds"
        percent:
          $ref: "#/components/schemas/Percent"

    DistrictDiscountInsert:
      type: object
      description: "Добавление скидки"
      properties:
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        ordnum:
          $ref: "#/components/schemas/Ordnum"
        name:
          $ref: "#/components/schemas/DistrictDiscountName"
        description:
          $ref: "#/components/schemas/DistrictDiscountDescription"
        district_ids:
          $ref: "./contract.yaml#/components/schemas/DistrictIds"
        percent:
          $ref: "#/components/schemas/Percent"
      required:
        - macroregion_id
        - ordnum
        - name
        - description
        - percent

    DistrictDiscountUpdate:
      type: object
      description: "Обновление скидки"
      properties:
        id:
          $ref: "#/components/schemas/DiscountId"
        macroregion_id:
          $ref: "./../geography/macroregion.yaml#/components/schemas/MacroRegionId"
        ordnum:
          $ref: "#/components/schemas/Ordnum"
        name:
          $ref: "#/components/schemas/DistrictDiscountName"
        description:
          $ref: "#/components/schemas/DistrictDiscountDescription"
        district_ids:
          $ref: "./contract.yaml#/components/schemas/DistrictIds"
        percent:
          $ref: "#/components/schemas/Percent"
      required:
        - id
        - macroregion_id
        - ordnum
        - name
        - description
        - percent

    DistrictDiscountDelete:
      type: object
      description: "Удаление скидки"
      properties:
        id:
          $ref: "#/components/schemas/DiscountId"
      required:
        - id

    PromoCode:
      type: object

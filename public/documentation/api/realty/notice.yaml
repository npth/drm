        electricity_id:
          $ref: "#/components/schemas/ElectricityId"
        parking:
          $ref: "#/components/schemas/Parking"
        security:
          $ref: "#/components/schemas/Security"
        railway:
          $ref: "#/components/schemas/Railway"
        refrigerator:

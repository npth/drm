openapi: 3.1.0
info:
  title: "Объявления"
  description: "Схемы для работы с объявлениями недвижимости"
  version: 1.0.0
components:
  schemas:
    NoticeId:
      type: integer
      description: "ID объявления"
      example: 1
    OperationId:
      type: integer
      description: "ID операции"
      example: 1
    TypeId:
      type: integer
      nullable: true
      description: "ID типа недвижимости"
      example: 1
    AdditionalTypeIds:
      type: array
      items:
        type: integer
      description: "Альтернативные типы недвижимости"
      example: [2, 3]
    ForCommercial:
      type: boolean
      nullable: true
      description: "Под коммерцию"
      example: false
    UseLandId:
      type: integer
      nullable: true
      description: "Вид использования з/у"
      example: 1
    ClientId:
      type: integer
      nullable: true
      description: "ID клиента"
      example: 10
    IsAgent:
      type: boolean
      description: "Агент"
      example: true
    StatusId:
      type: integer
      description: "Статус"
      example: 1
    PostedAt:
      type: string
      format: date-time
      nullable: true
      description: "Дата создания объявления"
    ChangedAt:
      type: string
      format: date-time
      nullable: true
      description: "Дата изменения объявления"
    ModeratedAt:
      type: string
      format: date-time
      nullable: true
      description: "Дата модерации"
    Price:
      type: integer
      nullable: true
      description: "Цена"
      example: 5000000
    PriceMin:
      type: integer
      nullable: true
      description: "Цена минимальная"
      example: 4500000
    NoticeName:
      type: string
      description: "Заголовок объявления"
      example: "Просторная квартира в центре"
    Content:
      type: string
      nullable: true
      description: "Содержание"
    Note:
      type: string
      nullable: true
      description: "Примечание"
    Description:
      type: string
      description: "Условия операции"
      example: "Прямая продажа от собственника"
    AreaTotal:
      type: number
      format: float
      nullable: true
      description: "Общая площадь"
      example: 85.5
    AreaMin:
      type: number
      format: float
      nullable: true
      description: "Общая площадь минимальная"
    AreaLiving:
      type: number
      format: float
      nullable: true
      description: "Жилая площадь"
    AreaKitchen:
      type: number
      format: float
      nullable: true
      description: "Площадь кухни"
    Land:
      type: number
      format: float
      nullable: true
      description: "Земельный участок"
    LandMin:
      type: number
      format: float
      nullable: true
      description: "Земельный участок, мин."
    Facade:
      type: number
      format: float
      nullable: true
      description: "Фасад"
    FloorTotal:
      type: integer
      nullable: true
      description: "Этажность"
    Floor:
      type: integer
      nullable: true
      description: "Этаж"
    Room:
      type: integer
      nullable: true
      description: "Количество комнат"
    RoomIsolated:
      type: integer
      nullable: true
      description: "Изолированных комнат"
    RoomTotal:
      type: integer
      nullable: true
      description: "Всего комнат в квартире"
    PlanId:
      type: integer
      nullable: true
      description: "Планировка"
    Latitude:
      type: number
      format: double
      nullable: true
      description: "Широта"
    Longitude:
      type: number
      format: double
      nullable: true
      description: "Долгота"
    RegionId:
      type: integer
      nullable: true
      description: "Код региона"
    DistrictId:
      type: integer
      nullable: true
      description: "Код района"
    CountyId:
      type: integer
      nullable: true
      description: "Код округа"
    PointId:
      type: integer
      nullable: true
      description: "Код населенного пункта"
    ComplexId:
      type: integer
      nullable: true
      description: "Код ЖК"
    GardenId:
      type: integer
      nullable: true
      description: "Садовое товарищество"
    MkrId:
      type: integer
      nullable: true
      description: "Код микрорайона"
    StreetId:
      type: integer
      nullable: true
      description: "Код улицы"
    Address:
      type: string
      nullable: true
      description: "Адрес"
    House:
      type: string
      nullable: true
      description: "Номер дома"
    Building:
      type: string
      nullable: true
      description: "Корпус"
    Liter:
      type: string
      nullable: true
      description: "Литер"
    Landmark:
      type: string
      nullable: true
      description: "Ориентир"
    MaterialId:
      type: integer
      nullable: true
      description: "Код материала"
    ConditionId:
      type: integer
      nullable: true
      description: "Состояние ремонта"
    DeveloperId:
      type: integer
      nullable: true
      description: "Строительная компания"
    Year:
      type: integer
      nullable: true
      description: "Год постройки"
    Quarter:
      type: integer
      nullable: true
      description: "Квартал года постройки"
    HousePart:
      type: integer
      nullable: true
      description: "Доля владения"
    HouseReady:
      type: integer
      nullable: true
      description: "Готовность дома"
    Bathroom:
      type: integer
      nullable: true
      description: "Ванных/душевых отдельных"
    Toilet:
      type: integer
      nullable: true
      description: "Туалетов отдельных"
    Lavatory:
      type: integer
      nullable: true
      description: "Санузлов совмещенных"
    Balcony:
      type: integer
      nullable: true
      description: "Балконов"
    Loggia:
      type: integer
      nullable: true
      description: "Лоджий"
    GlassBalconyId:
      type: integer
      nullable: true
      description: "Остекление балкона"
    GlassLoggiaId:
      type: integer
      nullable: true
      description: "Остекление лоджии"
    GasId:
      type: integer
      nullable: true
      description: "Газ"
    HeatingId:
      type: integer
      nullable: true
      description: "Отопление"
    SewerId:
      type: integer
      nullable: true
      description: "Канализация"
    WaterId:
      type: integer
      nullable: true
      description: "Водопровод"
    ElectricityId:
      type: integer
      nullable: true
      description: "Электричество"
    Parking:
      type: integer
      nullable: true
      description: "Парковочных мест своих"
    Security:
      type: integer
      nullable: true
      description: "Охрана"
    Railway:
      type: integer
      nullable: true
      description: "Ж/Д пути"
    Refrigerator:
      type: boolean
      nullable: true
      description: "Холодильник"
    Television:
      type: boolean
      nullable: true
      description: "Телевизор"
    Dishwasher:
      type: boolean
      nullable: true
      description: "Посудомоечная машина"
    Conditioner:
      type: boolean
      nullable: true
      description: "Кондиционер/Сплит"
    Washer:
      type: boolean
      nullable: true
      description: "Стиральная машина автомат"
    FurnitureId:
      type: integer
      nullable: true
      description: "Мебель"
    WithOwners:
      type: boolean
      nullable: true
      description: "С хозяевами"
    WithShared:
      type: boolean
      nullable: true
      description: "С подселением"
    RequirementId:
      type: integer
      nullable: true
      description: "Требования к арендаторам"

    Notice:
      type: object
      description: "Объявление"
      properties:
        id:
          $ref: "#/components/schemas/NoticeId"
        operation_id:

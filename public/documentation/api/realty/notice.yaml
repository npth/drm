        created_at:
          $ref: "./../common/components.yaml#/components/schemas/CreatedAt"
        updated_at:
          $ref: "./../common/components.yaml#/components/schemas/UpdatedAt"

    NoticeInsert:
      type: object
      description: "Добавление объявления"
      properties:
        operation_id:
          $ref: "#/components/schemas/OperationId"
        type_id:

        balcony:
          $ref: "#/components/schemas/Balcony"
        loggia:
          $ref: "#/components/schemas/Loggia"
        glass_balcony_id:
          $ref: "#/components/schemas/GlassBalconyId"
        glass_loggia_id:
          $ref: "#/components/schemas/GlassLoggiaId"
        gas_id:
          $ref: "#/components/schemas/GasId"
        heating_id:
          $ref: "#/components/schemas/HeatingId"
        sewer_id:
          $ref: "#/components/schemas/SewerId"
        water_id:
          $ref: "#/components/schemas/WaterId"
        electricity_id:
          $ref: "#/components/schemas/ElectricityId"

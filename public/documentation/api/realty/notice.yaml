        house:
          $ref: "#/components/schemas/House"
        building:
          $ref: "#/components/schemas/Building"
        liter:
          $ref: "#/components/schemas/Liter"
        landmark:
          $ref: "#/components/schemas/Landmark"
        material_id:
          $ref: "#/components/schemas/MaterialId"
        condition_id:
          $ref: "#/components/schemas/ConditionId"

          $ref: "#/components/schemas/WithShared"
        requirement_id:
          $ref: "#/components/schemas/RequirementId"
      required:
        - operation_id
        - is_agent
        - status_id
        - name
        - description

    NoticeUpdate:
      type: object
      description: "Обновление объявления"
      allOf:
        - $ref: '#/components/schemas/NoticeInsert'
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/NoticeId"
          required:
            - id

    NoticeDelete:
      type: object
      description: "Удаление объявления"
      properties:
        id:
          $ref: "#/components/schemas/NoticeId"
      required:
        - id

    Notices:
      type: array
      items:
        $ref: '#/components/schemas/Notice'

  requestBodies:
    NoticeInsertRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoticeInsert'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/NoticeInsert'
    NoticeUpdateRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoticeUpdate'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/NoticeUpdate'
    NoticeDeleteRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoticeDelete'
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/NoticeDelete'
  responses:
    NoticeResponse:
      description: "Объявление"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Notice'
    NoticesListResponse:
      description: "Список объявлений"
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Notices'
